name: Build web version into docs/

on:
  push:
    branches: [main]
    paths-ignore: [docs/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build WebAssembly bundle
        run: python -m pygbag --build main.py

      - name: Publish build output into docs/
        run: |
          rm -rf docs
          mkdir docs
          cp -r build/web/. docs/
          echo "supermangotm.org" > docs/CNAME

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rebuild web version (automated)"
          file_pattern: docs/**
