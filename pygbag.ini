[DEPENDENCIES]
# Paths are matched against pygbag's walk, which is rooted at "/" -- the leading
# slash matters. A bare name like "docs" only blocks that one folder and still
# descends into its children.
#
# .venv/ only exists on a dev machine (CI installs pygbag on the runner and has
# no virtualenv). Without it here a local build packs numpy and the whole env
# and lands at ~108MB instead of the ~19MB CI produces.
ignoreDirs = ["/docs", "/.venv"]
ignoreFiles = []
